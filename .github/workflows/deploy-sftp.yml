name: Deploy to SFTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # Two deploys landing together made the second fail mid-transfer (50webs
  # refuses the concurrent data channel). Serialise, newest wins.
  group: deploy-sftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies 📦
        run: npm ci

      - name: Install Deployment Tools 🛠️
        run: npm install dotenv

      - name: Build 🏗️
        run: npm run build

      - name: Build MovieShows 🎬
        run: |
          cd movieshows && npm ci && npm run build

      - name: Deploy to SFTP 🚀
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH1_EVENTS: ${{ secrets.FTP_PATH1_EVENTS }}
        run: npx tsx scripts/deploy-sftp.ts
