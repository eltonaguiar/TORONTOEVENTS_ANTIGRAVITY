name: Verify Stock Pick Performance

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    paths:
      - 'data/picks-archive/**'

permissions:
  contents: write

concurrency:
  group: verify-stock-pick-performance
  cancel-in-progress: false

jobs:
  verify-performance:
    runs-on: ${{ vars.ACTIONS_RUNNER_LABEL || 'ubuntu-latest' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run pick verification
        run: npx tsx scripts/verify-picks.ts
        env:
          NODE_ENV: production
      
      - name: Commit updated performance data
        env:
          TOKEN_FOR_PUSH: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/pick-performance.json public/data/pick-performance.json || true
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update pick performance data [skip ci]"
          bash .github/scripts/safe_push.sh
      
      # (No separate Push step — safe_push.sh handles token, retries, shallow, auth validation)
