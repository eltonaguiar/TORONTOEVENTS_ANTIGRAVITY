name: STOCKSUNIFY CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        # Pre-existing debt: 504 errors / 3040 warnings across src/. Next 16 removed
        # `next lint`, so this now calls the ESLint CLI directly. Keep it visible
        # (annotation + log) but do not fail the build until the debt is worked down.
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E "problems?\(" lint.log | tail -1)
          echo "::warning title=ESLint::${summary:-eslint produced no summary line}"
          exit 0

      - name: Run unit tests
        run: npm test -- --run
